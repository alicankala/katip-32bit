name: Full verification

on:
  push:
    branches:
      - master
      - 'test/**'
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check:win7-contract
      - run: npm run check:release-contract
      - run: npx vue-tsc --noEmit
      - run: npm run test:unit
      # Build, better-sqlite3 native modulunu Electron 22 ABI v110 + ia32 icin
      # hazirlar ve yayini kesin olarak kapali tutar.
      - run: npm run build -- --publish never
      - run: npm run test:integration
      - run: npm run test:business
      - run: npm run test:stage4
      # Smoke testi ayni ia32 Electron calisma zamanini ve yalniz
      # dogrulanmis gecici userData + SQLite kullanir.
      - run: npm run test:smoke
