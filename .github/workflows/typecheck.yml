name: Typecheck

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  typecheck:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Tip denetimi native modul gerektirmiyor. --ignore-scripts, better-sqlite3'un
      # kaynaktan derlenmeye kalkip Python/Visual Studio aramasini engelliyor.
      - run: npm ci --ignore-scripts
      - run: npx vue-tsc --noEmit
